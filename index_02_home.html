<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>上野清掃2.1</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    font-family: 'Hiragino Sans', 'Meiryo', sans-serif;
    background: #f3f7fb;
    color: #172033;
    -webkit-text-size-adjust: 100%;
  }
  body {
    height: 100vh;
    overflow: hidden;
  }
  .app-shell {
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: #fff;
  }
  .tabbar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border-bottom: 1px solid #cfd8e3;
    background: linear-gradient(180deg, #ffffff, #eef5fc);
    box-shadow: 0 2px 8px rgba(15, 74, 128, 0.10);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .brand {
    flex: 0 0 auto;
    color: #0f4a80;
    font-size: 15px;
    font-weight: 900;
    white-space: nowrap;
    padding: 0 3px;
  }
  .tabs {
    flex: 1 1 auto;
    display: flex;
    gap: 7px;
    overflow-x: auto;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab-btn {
    flex: 0 0 auto;
    min-width: 94px;
    border: 1px solid #b8cce4;
    border-radius: 12px;
    background: #f8fbff;
    color: #31506f;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    font-weight: 900;
    padding: 10px 13px;
    white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
  }
  .tab-btn.active {
    background: linear-gradient(135deg, #1a6eb5, #0f4a80);
    border-color: #0f4a80;
    color: #fff;
    box-shadow: 0 3px 8px rgba(15, 74, 128, 0.22);
  }
  .stage {
    flex: 1 1 auto;
    min-height: 0;
    position: relative;
    background: #fff;
  }
  .app-frame {
    display: none;
    width: 100%;
    height: 100%;
    border: 0;
    background: #fff;
  }
  .app-frame.active {
    display: block;
  }
  .loading {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    color: #64748b;
    font-size: 13px;
    font-weight: 800;
    pointer-events: none;
  }
  .stage.ready .loading {
    display: none;
  }
  @media (max-width: 520px) {
    .tabbar {
      padding: 7px 8px;
      gap: 6px;
    }
    .brand {
      font-size: 13px;
      max-width: 86px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tab-btn {
      min-width: 78px;
      padding: 9px 10px;
      font-size: 12px;
    }
  }
</style>
</head>
<body>
<div class="app-shell">
  <header class="tabbar" aria-label="ソフト切替">
    <div class="brand">上野清掃2.1</div>
    <nav class="tabs" id="tabs" aria-label="ソフト一覧"></nav>
  </header>
  <main class="stage" id="stage">
    <div class="loading">読み込み中...</div>
  </main>
</div>

<script>
const APPS = [
  { key: 'keiryou', title: '計量', href: 'index_3-16.html' },
  { key: 'bukken', title: '物件表', href: 'index_2-3_bukken.html' },
  { key: 'colview', title: '列選択', href: 'index_2-4_colview.html' },
  { key: 'memo', title: 'メモ', href: 'index_5-1.html' }
];

const tabsEl = document.getElementById('tabs');
const stageEl = document.getElementById('stage');
const frames = new Map();
let activeKey = safeStorageGet('ueno21_active_tab', APPS[0].key);
if (!APPS.some((app) => app.key === activeKey)) activeKey = APPS[0].key;

function safeStorageGet(key, fallback) {
  try {
    return localStorage.getItem(key) || fallback;
  } catch (error) {
    return fallback;
  }
}

function safeStorageSet(key, value) {
  try {
    localStorage.setItem(key, value);
  } catch (error) {
    // file:// やプライベート環境でもTab切替は止めない。
  }
}

function withEmbeddedParam(href) {
  return href + (href.includes('?') ? '&' : '?') + 'embedded=1';
}

function createTabs() {
  APPS.forEach((app) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'tab-btn';
    button.dataset.key = app.key;
    button.textContent = app.title;
    button.addEventListener('click', () => activateTab(app.key));
    tabsEl.appendChild(button);
  });
}

function preloadFrames() {
  APPS.forEach((app) => {
    const frame = document.createElement('iframe');
    frame.className = 'app-frame';
    frame.dataset.key = app.key;
    frame.title = app.title;
    frame.src = withEmbeddedParam(app.href);
    stageEl.appendChild(frame);
    frames.set(app.key, frame);
  });
  stageEl.classList.add('ready');
}

function activateTab(key) {
  activeKey = key;
  safeStorageSet('ueno21_active_tab', key);
  tabsEl.querySelectorAll('.tab-btn').forEach((button) => {
    const active = button.dataset.key === key;
    button.classList.toggle('active', active);
    button.setAttribute('aria-selected', active ? 'true' : 'false');
    if (active) button.scrollIntoView({ inline: 'nearest', block: 'nearest' });
  });
  frames.forEach((frame, frameKey) => {
    frame.classList.toggle('active', frameKey === key);
  });
}

createTabs();
preloadFrames();
activateTab(activeKey);
</script>
</body>
</html>
